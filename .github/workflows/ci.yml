name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer run of the same branch or pull request replaces the one in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:6
        env:
          # Throwaway credentials for the ephemeral CI database only.
          MONGO_INITDB_ROOT_USERNAME: ci_user
          MONGO_INITDB_ROOT_PASSWORD: ci_password_not_a_secret
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_MONGO_URI: mongodb://ci_user:ci_password_not_a_secret@localhost:27017/?authSource=admin
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Uses the version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # Fails on known high or critical vulnerabilities in production dependencies.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm test

  # Builds the image, starts the compose stack and checks it from the outside.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create a throwaway environment file
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" > .env

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for /readyz and check register and login
        run: scripts/smoke-test.sh http://127.0.0.1:5000

      - name: Show the logs when something failed
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
